[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "filtro-planos"
version = "0.2.0"
description = "Paso de ingesta que encuentra el límite exterior de planos y colorea sus trazos (muro y vidrio)."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pandas>=2.1",
    "pillow>=10",
    "pyarrow>=15",
    "pypdfium2>=4.30",
    "shapely>=2.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
service = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9"]
infra = ["redis>=5", "psycopg[binary]>=3.2", "boto3>=1.34"]
ml = ["scikit-learn>=1.4"]
download = ["gdown>=5"]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "moto>=5", "fakeredis>=2.23"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# File(...) como valor por defecto es el patrón de FastAPI
"src/filtro_planos/service/api.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
